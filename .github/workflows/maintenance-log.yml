name: Update maintenance log

on:
  push:
    branches:
      - main
    paths-ignore:
      - MAINTENANCE_LOG.md
      - .github/workflows/maintenance-log.yml
  workflow_dispatch:

permissions:
  contents: write

# If several pushes arrive close together, the next run scans every unlogged commit
# after the baseline, so a replaced pending run does not lose change records.
concurrency:
  group: maintenance-log-main
  cancel-in-progress: false

jobs:
  append-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate dashboard JavaScript syntax
        run: node --check docs/app.js

      - name: Append unlogged repository changes
        env:
          BASELINE_SHA: a72999a68ca320dcda3db86afa57dd91567933fd
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --quiet
          git checkout -B main origin/main

          log_file="MAINTENANCE_LOG.md"
          if [[ ! -f "$log_file" ]]; then
            echo "# Maintenance Log" > "$log_file"
            echo >> "$log_file"
          fi

          mapfile -t commits < <(git log --reverse --format='%H' "${BASELINE_SHA}..origin/main")
          added_entries=0

          for commit in "${commits[@]}"; do
            # A full SHA in the log means this commit has already been recorded.
            if grep -Fq "$commit" "$log_file"; then
              continue
            fi

            mapfile -t changed_files < <(git diff-tree --no-commit-id --name-only -r "$commit" | sort -u)

            # Ignore commits that only update this log or this workflow.
            relevant=false
            for file in "${changed_files[@]}"; do
              if [[ "$file" != "MAINTENANCE_LOG.md" && "$file" != ".github/workflows/maintenance-log.yml" ]]; then
                relevant=true
                break
              fi
            done
            if [[ "$relevant" != true ]]; then
              continue
            fi

            commit_date="$(git show -s --format=%cI "$commit" | cut -d'T' -f1)"
            commit_subject="$(git show -s --format=%s "$commit")"
            commit_short="${commit:0:7}"

            {
              echo
              echo "### ${commit_date} — ${commit_subject}"
              echo
              echo "- **Commit:** [${commit_short}](https://github.com/${GITHUB_REPOSITORY}/commit/${commit})"
              echo "- **Files changed:**"
              if [[ ${#changed_files[@]} -eq 0 ]]; then
                echo "  - No file paths detected."
              else
                for file in "${changed_files[@]}"; do
                  echo "  - $file"
                done
              fi
            } >> "$log_file"

            added_entries=$((added_entries + 1))
          done

          if [[ "$added_entries" -eq 0 ]] || git diff --quiet -- "$log_file"; then
            echo "No new repository changes need to be logged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log_file"
          git commit -m "docs: update maintenance log [skip ci]"

          # Retry if main changes while the log is being written.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done

          echo "Could not push the maintenance log after three attempts." >&2
          exit 1
